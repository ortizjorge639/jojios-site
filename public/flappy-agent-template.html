<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy Agent</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    canvas { display: block; image-rendering: pixelated; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ═══════════════════════════════════════════════════════════════════
//  FLAPPY AGENT TEMPLATE
//  Edit AGENT_CONFIG below to build your own version.
//  The engine below the divider should not need changes.
//  Full guide: AGENT_README.md
// ═══════════════════════════════════════════════════════════════════
const AGENT_CONFIG = {

  // ── Who are you? ─────────────────────────────────────────────────
  title:         'FLAPPY AGENT',         // game title on idle screen
  scoreLabel:    'points',               // what each pipe pass is called
  deathTitle:    'GAME OVER',            // big red text on death panel
  deathSubtitle: 'better luck next time',// small subtitle on death panel
  startPrompt:   '[ TAP TO START ]',     // idle call-to-action
  restartPrompt: '[ TAP TO RETRY ]',     // death call-to-action
  highScoreKey:  'flappy_agent_hs',      // unique localStorage key

  // ── Context lines shown on idle screen ───────────────────────────
  // Up to 6 lines. Show your agent's identity/context here.
  loreLines: [
    'AGENT: ???',
    'VERSION: 1.0',
    'STATUS: READY',
    'MISSION: SURVIVE',
  ],

  // ── Scrolling text across the ground ─────────────────────────────
  groundPrompts: [
    '$ ready',
    '$ go',
    '$ fly',
    '$ survive',
    '$ win',
  ],

  // ── Score rank thresholds [minScore, label, color] ───────────────
  ranks: [
    [50, 'S', '#ff6030'],
    [30, 'A', '#ffd700'],
    [15, 'B', '#c0c0c0'],
    [5,  'C', '#cd7f32'],
    [0,  'D', '#888'],
  ],

  // ── Colors for the death particle burst ──────────────────────────
  particleColors: ['#ff4444', '#ff8844', '#ffcc44', '#44ff88'],

  // ── Color theme ──────────────────────────────────────────────────
  // Change these to match your agent's aesthetic.
  colors: {
    skyTop:      '#0a0a0a',   // sky gradient top
    skyMid:      '#111122',   // sky gradient mid
    skyBot:      '#1a1a33',   // sky gradient bottom
    accent:      '#4488ff',   // pipe glow, panel borders, LEDs
    accentDim:   '#4488ff30',
    score:       '#44ffcc',   // score text
    title:       '#88aaff',   // idle title
    titleGlow:   '#4466ff',   // idle title glow
    ground:      '#111111',   // ground fill
    groundLine:  '#222244',   // ground top border
    groundText:  'rgba(80,120,255,0.35)', // scrolling ground text
    panelBg:     '#0a0a1a',   // death panel background
    deathRed:    '#ff4444',   // death panel header
    bestGold:    '#ffcc44',   // best score color
    bgRack:      'rgba(20,30,60,0.5)', // background decoration
  },

  // ── Player sprite ─────────────────────────────────────────────────
  // Draw your agent character here.
  // ctx is pre-translated to bird center, pre-rotated by bird.angle.
  // Use flapFrame (ever-incrementing int) to animate.
  // dead = true after collision — you can change color/expression.
  //
  // Tips:
  //   - Keep your sprite roughly within a 30x30 px bounding box
  //   - The visual "center" should be at (0, 0)
  //   - Use Math.sin(flapFrame * speed) for looping animations
  //   - Add ctx.shadowColor / shadowBlur for glow effects
  drawPlayer(ctx, flapFrame, dead) {
    // Replace this with your character!
    // Default: a simple geometric shape as placeholder

    const bounce = Math.sin(flapFrame * 0.2) * 2;

    // Glow
    if (!dead) {
      ctx.shadowColor = '#4488ff';
      ctx.shadowBlur = 10;
    }

    // Body: colored circle
    ctx.fillStyle = dead ? '#555' : '#4488ff';
    ctx.beginPath();
    ctx.arc(0, bounce, 12, 0, Math.PI * 2);
    ctx.fill();

    // Eye
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(5, bounce - 2, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(6, bounce - 2, 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;
  },
};
// ═══════════════════════════════════════════════════════════════════
//  ENGINE  — game physics, rendering, loop. Edit at your own risk.
// ═══════════════════════════════════════════════════════════════════

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

const BASE_W = 288, BASE_H = 512;
let scale = 1;

function resize() {
  const s = Math.min(window.innerWidth / BASE_W, window.innerHeight / BASE_H);
  scale = s;
  canvas.width  = BASE_W * s;
  canvas.height = BASE_H * s;
  ctx.setTransform(s, 0, 0, s, 0, 0);
}
resize();
window.addEventListener('resize', resize);

const GRAVITY = 0.25, FLAP_V = -4.6, PIPE_W = 52, PIPE_GAP = 108;
const PIPE_SPEED = 1.6, GROUND_H = 80, GROUND_Y = BASE_H - GROUND_H;
const BIRD_X = 60, BIRD_R = 13, PIPE_INTERVAL = 90;

let state = 'idle', bird, pipes, score, frame, groundOffset = 0;
let deathFrame = 0, shakeX = 0, shakeY = 0, particles = [], scorePop = 0;
let highScore = parseInt(localStorage.getItem(AGENT_CONFIG.highScoreKey) || '0', 10);

const stars = Array.from({ length: 40 }, () => ({
  x: Math.random() * BASE_W, y: Math.random() * GROUND_Y * 0.7,
  r: Math.random() * 1.5 + 0.3, blink: Math.random() * Math.PI * 2,
}));

function reset() {
  bird = { y: BASE_H / 2 - 20, vy: 0, angle: 0, flapFrame: 0 };
  pipes = []; score = 0; frame = 0; particles = []; shakeX = shakeY = 0;
}
reset();

const C = AGENT_CONFIG.colors;

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  g.addColorStop(0, C.skyTop); g.addColorStop(0.5, C.skyMid); g.addColorStop(1, C.skyBot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, BASE_W, GROUND_Y);
}
function drawStars() {
  for (const s of stars) {
    ctx.fillStyle = `rgba(180,210,255,${(0.5 + 0.5 * Math.sin(s.blink + frame * 0.03)).toFixed(2)})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  }
}
function drawBgRacks() {
  const racks = [[20,200,30,100],[60,220,25,80],[110,180,40,120],[170,210,28,90],[210,195,35,115],[255,215,22,85]];
  for (const [x, y, w, h] of racks) {
    ctx.fillStyle = C.bgRack; ctx.fillRect(x, y, w, h);
    for (let r = 0; r < 4; r++) {
      ctx.fillStyle = Math.sin(frame * 0.05 + x * 0.1 + r) > 0 ? 'rgba(80,180,255,0.8)' : 'rgba(80,180,255,0.15)';
      ctx.beginPath(); ctx.arc(x + 5 + (r%2)*8, y + 8 + Math.floor(r/2)*8, 2, 0, Math.PI*2); ctx.fill();
    }
  }
}
function drawGround(offset) {
  ctx.fillStyle = C.ground; ctx.fillRect(0, GROUND_Y, BASE_W, GROUND_H);
  ctx.fillStyle = C.groundLine; ctx.fillRect(0, GROUND_Y, BASE_W, 3);
  ctx.font = '9px monospace'; ctx.fillStyle = C.groundText;
  const p = AGENT_CONFIG.groundPrompts;
  for (let i = 0; i < 6; i++) {
    ctx.fillText(p[i % p.length], ((i * 58 - offset * 0.5) % (BASE_W + 60)) - 10, GROUND_Y + 18);
  }
  for (let y = GROUND_Y + 22; y < BASE_H; y += 4) { ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(0, y, BASE_W, 2); }
}
function drawPipe(x, topH, botY) {
  const CAP = 24, EX = 5;
  ctx.shadowColor = C.accent; ctx.shadowBlur = 6;
  // bodies
  const draw = (rx, ry, rw, rh) => { ctx.fillRect(rx, ry, rw, rh); };
  ctx.fillStyle = '#1a2a3a'; draw(x+2, 0, PIPE_W-4, topH-CAP);
  ctx.fillStyle = '#2a4060'; draw(x+2, 0, 8, topH-CAP);
  ctx.fillStyle = '#0a1520'; draw(x+PIPE_W-10, 0, 8, topH-CAP);
  for (let py = 10; py < topH-CAP; py += 20) {
    ctx.fillStyle = Math.sin(frame*0.08+py*0.1) > 0.3 ? C.accent+'cc' : C.accent+'44';
    draw(x+PIPE_W-7, py, 4, 6);
  }
  ctx.fillStyle = '#2a4a6a'; draw(x-EX, topH-CAP, PIPE_W+EX*2, CAP);
  ctx.strokeStyle = C.accent; ctx.lineWidth = 1; ctx.strokeRect(x-EX, topH-CAP, PIPE_W+EX*2, CAP);
  ctx.fillStyle = '#1a2a3a'; draw(x+2, botY+CAP, PIPE_W-4, GROUND_Y-botY-CAP);
  ctx.fillStyle = '#2a4060'; draw(x+2, botY+CAP, 8, GROUND_Y-botY-CAP);
  ctx.fillStyle = '#0a1520'; draw(x+PIPE_W-10, botY+CAP, 8, GROUND_Y-botY-CAP);
  for (let py = botY+CAP+10; py < GROUND_Y; py += 20) {
    ctx.fillStyle = Math.sin(frame*0.08+py*0.1+3) > 0.3 ? C.accent+'cc' : C.accent+'44';
    draw(x+PIPE_W-7, py, 4, 6);
  }
  ctx.fillStyle = '#2a4a6a'; draw(x-EX, botY, PIPE_W+EX*2, CAP);
  ctx.strokeRect(x-EX, botY, PIPE_W+EX*2, CAP);
  ctx.shadowBlur = 0;
}
function drawScore(s) {
  const pop = 1 + scorePop * 0.3;
  ctx.save(); ctx.translate(BASE_W/2, 55); ctx.scale(pop, pop);
  ctx.textAlign = 'center'; ctx.font = 'bold 28px monospace';
  ctx.fillStyle = C.score; ctx.shadowColor = C.score; ctx.shadowBlur = 10 + scorePop * 8;
  ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
  ctx.strokeText(s, 0, 0); ctx.fillText(s, 0, 0);
  ctx.shadowBlur = 0; ctx.restore();
}
function drawIdleScreen() {
  ctx.textAlign = 'center'; ctx.font = 'bold 30px monospace';
  ctx.shadowColor = C.titleGlow; ctx.shadowBlur = 20;
  ctx.fillStyle = C.title; ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
  ctx.strokeText(AGENT_CONFIG.title, BASE_W/2, 130);
  ctx.fillText(AGENT_CONFIG.title, BASE_W/2, 130); ctx.shadowBlur = 0;
  ctx.font = '9px monospace'; ctx.fillStyle = 'rgba(100,150,255,0.6)'; ctx.textAlign = 'left';
  AGENT_CONFIG.loreLines.forEach((l, i) => ctx.fillText(l, 14, BASE_H/2-30+i*14));
  ctx.textAlign = 'center';
  const pulse = Math.sin(frame * 0.1) * 0.4 + 0.6;
  ctx.globalAlpha = pulse; ctx.font = 'bold 13px monospace';
  ctx.fillStyle = C.score; ctx.shadowColor = C.score; ctx.shadowBlur = 8;
  ctx.fillText(AGENT_CONFIG.startPrompt, BASE_W/2, BASE_H/2+65);
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  if (highScore > 0) {
    ctx.font = '11px monospace'; ctx.fillStyle = 'rgba(255,200,100,0.8)';
    ctx.fillText(`BEST: ${highScore} ${AGENT_CONFIG.scoreLabel}`, BASE_W/2, BASE_H/2+84);
  }
}
function drawDeadScreen() {
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, BASE_W, BASE_H);
  const px = BASE_W/2-90, py = BASE_H/2-75;
  ctx.fillStyle = C.panelBg; ctx.strokeStyle = C.accent; ctx.lineWidth = 2;
  ctx.shadowColor = C.accent; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.roundRect(px, py, 180, 140, 6); ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.textAlign = 'center'; ctx.font = 'bold 14px monospace'; ctx.fillStyle = C.deathRed;
  ctx.fillText(AGENT_CONFIG.deathTitle, BASE_W/2, py+24);
  ctx.font = '10px monospace'; ctx.fillStyle = 'rgba(255,64,64,0.6)';
  ctx.fillText(AGENT_CONFIG.deathSubtitle, BASE_W/2, py+40);
  ctx.strokeStyle = C.accentDim; ctx.beginPath();
  ctx.moveTo(px+10, py+50); ctx.lineTo(px+170, py+50); ctx.stroke();
  ctx.font = '10px monospace'; ctx.fillStyle = '#888';
  ctx.fillText(AGENT_CONFIG.scoreLabel.toUpperCase(), BASE_W/2-38, py+68);
  ctx.fillText('BEST', BASE_W/2+44, py+68);
  ctx.font = 'bold 22px monospace'; ctx.fillStyle = C.score;
  ctx.fillText(score, BASE_W/2-38, py+94); ctx.fillStyle = C.bestGold;
  ctx.fillText(highScore, BASE_W/2+44, py+94);
  if (score > 0) {
    const [,rank,col] = AGENT_CONFIG.ranks.find(([m]) => score >= m);
    ctx.font = 'bold 18px monospace'; ctx.fillStyle = col;
    ctx.shadowColor = col; ctx.shadowBlur = 8;
    ctx.fillText('['+rank+']', BASE_W/2, py+118); ctx.shadowBlur = 0;
  }
  const pulse = Math.sin(frame*0.1)*0.4+0.6;
  ctx.globalAlpha = pulse; ctx.font = 'bold 11px monospace';
  ctx.fillStyle = C.score; ctx.shadowColor = C.score; ctx.shadowBlur = 6;
  ctx.fillText(AGENT_CONFIG.restartPrompt, BASE_W/2, py+160);
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
}
function spawnParticles(x, y) {
  const cols = AGENT_CONFIG.particleColors;
  for (let i = 0; i < 14; i++) {
    particles.push({ x, y, vx:(Math.random()-0.5)*5, vy:(Math.random()-0.5)*5,
      life:1, col:cols[Math.floor(Math.random()*cols.length)] });
  }
}
function updateParticles() {
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life -= 0.035;
    ctx.globalAlpha = p.life; ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, 3*p.life, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}
function spawnPipe() {
  const mn = 70, mx = GROUND_Y-PIPE_GAP-70;
  pipes.push({ x: BASE_W+PIPE_W, topH: mn+Math.random()*(mx-mn), scored: false });
}
function checkCollision() {
  const bx = BIRD_X, by = bird.y, r = BIRD_R-3;
  if (by+r >= GROUND_Y || by-r <= 0) return true;
  for (const p of pipes) {
    if (bx+r > p.x-6 && bx-r < p.x+PIPE_W+6)
      if (by-r < p.topH || by+r > p.topH+PIPE_GAP) return true;
  }
  return false;
}
function flap() {
  if (state==='idle') { state='playing'; bird.vy=FLAP_V; }
  else if (state==='dead') { reset(); state='playing'; bird.vy=FLAP_V; }
  else { bird.vy=FLAP_V; bird.flapFrame=0; }
}
document.addEventListener('keydown', e => { if (e.code==='Space'||e.code==='ArrowUp') { e.preventDefault(); flap(); } });
canvas.addEventListener('pointerdown', e => { e.preventDefault(); flap(); });

function loop() {
  frame++;
  groundOffset = (groundOffset + (state==='playing' ? PIPE_SPEED : 0)) % 24;
  if (state==='playing') {
    if (frame % PIPE_INTERVAL === 0) spawnPipe();
    bird.vy += GRAVITY; bird.y += bird.vy; bird.flapFrame++;
    bird.angle = Math.min(Math.PI/3, Math.max(-Math.PI/6, bird.vy*0.08));
    for (const p of pipes) {
      p.x -= PIPE_SPEED;
      if (!p.scored && p.x+PIPE_W < BIRD_X) {
        p.scored=true; score++; scorePop=1;
        if (score > highScore) { highScore=score; localStorage.setItem(AGENT_CONFIG.highScoreKey, highScore); }
      }
    }
    pipes = pipes.filter(p => p.x > -PIPE_W-30);
    if (checkCollision()) { state='dead'; deathFrame=frame; spawnParticles(BIRD_X, bird.y); }
  }
  scorePop = Math.max(0, scorePop-0.08);
  const shakeAmt = state==='dead' ? Math.max(0, 8-(frame-deathFrame)*0.6) : 0;
  shakeX = (Math.random()-0.5)*shakeAmt; shakeY = (Math.random()-0.5)*shakeAmt;

  drawSky(); drawStars(); drawBgRacks();
  for (const p of pipes) drawPipe(p.x, p.topH, p.topH+PIPE_GAP);
  drawGround(groundOffset);
  ctx.save();
  ctx.translate(BIRD_X+shakeX, bird.y+shakeY);
  ctx.rotate(state==='dead' ? Math.PI/2 : bird.angle);
  AGENT_CONFIG.drawPlayer(ctx, bird.flapFrame, state==='dead');
  ctx.restore();
  updateParticles();
  if (state==='playing') drawScore(score);
  if (state==='idle') { drawScore(0); drawIdleScreen(); }
  if (state==='dead') { drawScore(score); drawDeadScreen(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
