<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy Bird</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// Scale to fit screen maintaining aspect ratio
const BASE_W = 288;
const BASE_H = 512;
let scale = 1;

function resize() {
  const s = Math.min(window.innerWidth / BASE_W, window.innerHeight / BASE_H);
  scale = s;
  canvas.width = BASE_W * s;
  canvas.height = BASE_H * s;
  ctx.setTransform(s, 0, 0, s, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// --- PALETTE ---
const C = {
  sky:        '#70c5ce',
  skyBot:     '#c9e9ed',
  ground:     '#ded895',
  groundDark: '#bfaf4e',
  pipe:       '#73bf2e',
  pipeDark:   '#558c1d',
  pipeCap:    '#5da020',
  birdY:      '#f5c518',
  birdEye:    '#ffffff',
  birdPupil:  '#000000',
  birdBeak:   '#f0a020',
  birdWing:   '#e8b000',
  birdBlush:  '#f88',
  white:      '#ffffff',
  black:      '#000000',
};

// --- CONSTANTS ---
const GRAVITY    = 0.25;
const FLAP_V     = -4.6;
const PIPE_W     = 52;
const PIPE_GAP   = 100;
const PIPE_SPEED = 1.6;
const GROUND_H   = 112;
const GROUND_Y   = BASE_H - GROUND_H;
const BIRD_X     = 60;
const BIRD_R     = 12;

// --- STATE ---
let state = 'idle'; // idle | playing | dead
let bird, pipes, score, frame, highScore = 0, groundOffset = 0;

function reset() {
  bird = { y: BASE_H / 2 - 20, vy: 0, angle: 0, flapFrame: 0 };
  pipes = [];
  score = 0;
  frame = 0;
}

reset();

// --- DRAW HELPERS ---
function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  grad.addColorStop(0, C.sky);
  grad.addColorStop(1, C.skyBot);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, BASE_W, GROUND_Y);
}

function drawCloud(x, y, w) {
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.ellipse(x, y, w * 0.5, 8, 0, 0, Math.PI * 2);
  ctx.ellipse(x - w * 0.2, y + 4, w * 0.3, 7, 0, 0, Math.PI * 2);
  ctx.ellipse(x + w * 0.25, y + 3, w * 0.28, 6, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawGround(offset) {
  // Green strip
  ctx.fillStyle = '#5a9a1c';
  ctx.fillRect(0, GROUND_Y, BASE_W, 16);
  // Tan ground
  ctx.fillStyle = C.ground;
  ctx.fillRect(0, GROUND_Y + 16, BASE_W, GROUND_H - 16);
  // Darker bottom strip
  ctx.fillStyle = C.groundDark;
  ctx.fillRect(0, GROUND_Y + 16, BASE_W, 6);
  // Stripes
  ctx.fillStyle = 'rgba(0,0,0,0.06)';
  for (let x = (-offset % 24); x < BASE_W + 24; x += 24) {
    ctx.fillRect(x, GROUND_Y + 22, 12, GROUND_H - 22);
  }
}

function drawPipe(x, topH, botY) {
  const CAP_H = 26, CAP_EXTRA = 6;

  // Top pipe body
  ctx.fillStyle = C.pipe;
  ctx.fillRect(x + 2, 0, PIPE_W - 4, topH - CAP_H);
  // Top pipe dark side
  ctx.fillStyle = C.pipeDark;
  ctx.fillRect(x + PIPE_W - 8, 0, 6, topH - CAP_H);
  // Top pipe light side
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.fillRect(x + 2, 0, 6, topH - CAP_H);
  // Top pipe cap
  ctx.fillStyle = C.pipeCap;
  ctx.fillRect(x - CAP_EXTRA, topH - CAP_H, PIPE_W + CAP_EXTRA * 2, CAP_H);
  ctx.fillStyle = C.pipeDark;
  ctx.fillRect(x - CAP_EXTRA + PIPE_W + CAP_EXTRA - 8, topH - CAP_H, 8, CAP_H);
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.fillRect(x - CAP_EXTRA, topH - CAP_H, 8, CAP_H);
  // Border
  ctx.strokeStyle = C.pipeDark;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(x - CAP_EXTRA, topH - CAP_H, PIPE_W + CAP_EXTRA * 2, CAP_H);

  // Bottom pipe body
  ctx.fillStyle = C.pipe;
  ctx.fillRect(x + 2, botY + CAP_H, PIPE_W - 4, GROUND_Y - botY - CAP_H);
  ctx.fillStyle = C.pipeDark;
  ctx.fillRect(x + PIPE_W - 8, botY + CAP_H, 6, GROUND_Y - botY - CAP_H);
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.fillRect(x + 2, botY + CAP_H, 6, GROUND_Y - botY - CAP_H);
  // Bottom pipe cap
  ctx.fillStyle = C.pipeCap;
  ctx.fillRect(x - CAP_EXTRA, botY, PIPE_W + CAP_EXTRA * 2, CAP_H);
  ctx.fillStyle = C.pipeDark;
  ctx.fillRect(x - CAP_EXTRA + PIPE_W + CAP_EXTRA - 8, botY, 8, CAP_H);
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.fillRect(x - CAP_EXTRA, botY, 8, CAP_H);
  ctx.strokeStyle = C.pipeDark;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(x - CAP_EXTRA, botY, PIPE_W + CAP_EXTRA * 2, CAP_H);
}

function drawBird(x, y, angle, flapFrame) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);

  // Wing (behind body)
  const wingY = (flapFrame % 6 < 2) ? 4 : (flapFrame % 6 < 4) ? 0 : -2;
  ctx.fillStyle = C.birdWing;
  ctx.beginPath();
  ctx.ellipse(-2, wingY, 8, 5, -0.3, 0, Math.PI * 2);
  ctx.fill();

  // Body
  ctx.fillStyle = C.birdY;
  ctx.beginPath();
  ctx.ellipse(0, 0, BIRD_R, BIRD_R - 1, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Belly
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath();
  ctx.ellipse(2, 3, 7, 5, 0.3, 0, Math.PI * 2);
  ctx.fill();

  // Eye white
  ctx.fillStyle = C.birdEye;
  ctx.beginPath();
  ctx.arc(6, -3, 4.5, 0, Math.PI * 2);
  ctx.fill();

  // Pupil
  ctx.fillStyle = C.birdPupil;
  ctx.beginPath();
  ctx.arc(7, -3, 2, 0, Math.PI * 2);
  ctx.fill();

  // Eye shine
  ctx.fillStyle = C.white;
  ctx.beginPath();
  ctx.arc(7.5, -4, 1, 0, Math.PI * 2);
  ctx.fill();

  // Beak
  ctx.fillStyle = C.birdBeak;
  ctx.beginPath();
  ctx.moveTo(9, -1);
  ctx.lineTo(16, 1);
  ctx.lineTo(9, 3);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 0.5;
  ctx.stroke();

  ctx.restore();
}

function drawScore(s) {
  ctx.textAlign = 'center';
  ctx.font = 'bold 32px Arial';
  ctx.fillStyle = C.white;
  ctx.strokeStyle = C.black;
  ctx.lineWidth = 4;
  ctx.strokeText(s, BASE_W / 2, 60);
  ctx.fillText(s, BASE_W / 2, 60);
}

function drawIdleScreen() {
  ctx.textAlign = 'center';
  // Title box
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath();
  ctx.roundRect(BASE_W/2 - 90, 110, 180, 50, 8);
  ctx.fill();

  ctx.font = 'bold 28px Arial';
  ctx.fillStyle = C.white;
  ctx.strokeStyle = C.black;
  ctx.lineWidth = 4;
  ctx.strokeText('FLAPPY BIRD', BASE_W / 2, 143);
  ctx.fillStyle = '#f5c518';
  ctx.fillText('FLAPPY BIRD', BASE_W / 2, 143);

  // Tap prompt
  ctx.font = 'bold 14px Arial';
  ctx.fillStyle = C.white;
  ctx.strokeStyle = C.black;
  ctx.lineWidth = 2;
  const pulse = Math.sin(frame * 0.08) * 0.3 + 0.7;
  ctx.globalAlpha = pulse;
  ctx.strokeText('TAP TO START', BASE_W / 2, BASE_H / 2 + 50);
  ctx.fillText('TAP TO START', BASE_W / 2, BASE_H / 2 + 50);
  ctx.globalAlpha = 1;

  if (highScore > 0) {
    ctx.font = 'bold 12px Arial';
    ctx.fillStyle = C.white;
    ctx.strokeStyle = C.black;
    ctx.lineWidth = 2;
    ctx.strokeText('BEST: ' + highScore, BASE_W / 2, BASE_H / 2 + 72);
    ctx.fillText('BEST: ' + highScore, BASE_W / 2, BASE_H / 2 + 72);
  }
}

function drawDeadScreen() {
  // Overlay
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(0, 0, BASE_W, BASE_H);

  // Score panel
  ctx.fillStyle = '#f0e0a0';
  ctx.strokeStyle = '#c8a040';
  ctx.lineWidth = 3;
  const px = BASE_W/2 - 80, py = BASE_H/2 - 70;
  ctx.beginPath();
  ctx.roundRect(px, py, 160, 130, 10);
  ctx.fill();
  ctx.stroke();

  ctx.textAlign = 'center';
  ctx.font = 'bold 20px Arial';
  ctx.fillStyle = '#c8601c';
  ctx.strokeStyle = 'rgba(0,0,0,0.1)';
  ctx.lineWidth = 1;
  ctx.strokeText('GAME OVER', BASE_W/2, py + 28);
  ctx.fillText('GAME OVER', BASE_W/2, py + 28);

  ctx.font = 'bold 14px Arial';
  ctx.fillStyle = '#888';
  ctx.fillText('SCORE', BASE_W/2 - 35, py + 62);
  ctx.fillText('BEST', BASE_W/2 + 35, py + 62);

  ctx.font = 'bold 22px Arial';
  ctx.fillStyle = '#333';
  ctx.fillText(score, BASE_W/2 - 35, py + 88);
  ctx.fillText(highScore, BASE_W/2 + 35, py + 88);

  // Medal
  if (score >= 10) {
    ctx.fillStyle = score >= 30 ? '#ffd700' : score >= 20 ? '#c0c0c0' : '#cd7f32';
    ctx.beginPath();
    ctx.arc(BASE_W/2, py + 108, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Restart prompt
  ctx.font = 'bold 14px Arial';
  ctx.fillStyle = C.white;
  ctx.strokeStyle = C.black;
  ctx.lineWidth = 2;
  const pulse = Math.sin(frame * 0.08) * 0.3 + 0.7;
  ctx.globalAlpha = pulse;
  ctx.strokeText('TAP TO RESTART', BASE_W / 2, py + 150);
  ctx.fillText('TAP TO RESTART', BASE_W / 2, py + 150);
  ctx.globalAlpha = 1;
}

// --- PIPE GENERATION ---
function spawnPipe() {
  const minTop = 60;
  const maxTop = GROUND_Y - PIPE_GAP - 60;
  const topH = minTop + Math.random() * (maxTop - minTop);
  pipes.push({ x: BASE_W + PIPE_W, topH, scored: false });
}

// --- COLLISION ---
function checkCollision() {
  const bx = BIRD_X, by = bird.y;
  const r = BIRD_R - 2;

  // Ground / ceiling
  if (by + r >= GROUND_Y || by - r <= 0) return true;

  for (const p of pipes) {
    const px = p.x - 6, pw = PIPE_W + 12;
    const botY = p.topH + PIPE_GAP;
    if (bx + r > px && bx - r < px + pw) {
      if (by - r < p.topH || by + r > botY) return true;
    }
  }
  return false;
}

// --- INPUT ---
function flap() {
  if (state === 'idle') {
    state = 'playing';
    bird.vy = FLAP_V;
    return;
  }
  if (state === 'dead') {
    reset();
    state = 'playing';
    bird.vy = FLAP_V;
    return;
  }
  if (state === 'playing') {
    bird.vy = FLAP_V;
    bird.flapFrame = 0;
  }
}

document.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp') flap(); });
canvas.addEventListener('pointerdown', e => { e.preventDefault(); flap(); });

// --- GAME LOOP ---
let lastTime = 0;
const PIPE_INTERVAL = 90;

function loop(ts) {
  frame++;
  groundOffset = (groundOffset + (state === 'playing' ? PIPE_SPEED : 0)) % 24;

  // Spawn pipes
  if (state === 'playing' && frame % PIPE_INTERVAL === 0) spawnPipe();

  // Physics
  if (state === 'playing') {
    bird.vy += GRAVITY;
    bird.y += bird.vy;
    bird.flapFrame++;
    bird.angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 6, bird.vy * 0.07));

    // Move pipes
    for (const p of pipes) {
      p.x -= PIPE_SPEED;
      if (!p.scored && p.x + PIPE_W < BIRD_X) {
        p.scored = true;
        score++;
        if (score > highScore) highScore = score;
      }
    }
    pipes = pipes.filter(p => p.x > -PIPE_W - 20);

    if (checkCollision()) {
      state = 'dead';
    }
  }

  // --- DRAW ---
  drawSky();

  // Clouds (static for simplicity)
  drawCloud(50, 80, 50);
  drawCloud(170, 55, 40);
  drawCloud(240, 100, 35);

  // Pipes
  for (const p of pipes) drawPipe(p.x, p.topH, p.topH + PIPE_GAP);

  // Ground
  drawGround(groundOffset);

  // Bird
  const deadBounce = (state === 'dead') ? 0 : 0;
  drawBird(BIRD_X, bird.y + deadBounce, bird.angle, bird.flapFrame);

  // UI
  if (state === 'playing') drawScore(score);
  if (state === 'idle') { drawScore(0); drawIdleScreen(); }
  if (state === 'dead') { drawScore(score); drawDeadScreen(); }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
