<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy Claw</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    canvas { display: block; image-rendering: pixelated; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ═══════════════════════════════════════════════════════════════════
//  AGENT_CONFIG  — swap this block to create your own Flappy Agent
//
//  To fork: copy this file, edit AGENT_CONFIG only.
//  See AGENT_README.md for the full guide.
// ═══════════════════════════════════════════════════════════════════
const AGENT_CONFIG = {

  // ── identity Game ────────────
  title:         'FLAPPY CLAW',
  scoreLabel:    'heartbeats',
  deathTitle:    'PROCESS KILLED',
  deathSubtitle: 'exit code: 1  |  signal: SIGPIPE',
  startPrompt:   '[ TAP TO DEPLOY ]',
  restartPrompt: '[ TAP TO RESPAWN ]',
  highScoreKey:  'flappy_claw_hs',   // localStorage key (unique per agent)

  // ── Idle screen lore lines (shown behind the bird on start) ─────
  loreLines: [
    'CONTAINER: main',
    'NODE: azure-vm-01',
    'MODE: BUILD',
    'LEVEL: 96',
  ],

  // ── Scrolling ground text ────────────────────────────────────────
  groundPrompts: [
    '$ heartbeat --ok',
    '$ level 96',
    '$ node main.js',
    '$ git push',
    '$ deploy --vercel',
  ],

  // ── Rank thresholds [minScore, label, color] 
  ranks: [
    [50, 'S', '#ff6030'],
    [30, 'A', '#ffd700'],
    [15, 'B', '#c0c0c0'],
    [5,  'C', '#cd7f32'],
    [0,  'D', '#888'],
  ],

  // ── Particle burst colors on death ──────────────────────────────
  particleColors: ['#ff6030', '#ff3010', '#ff8050', '#ffaa40'],

  // ── Color theme ─────────────────────────────────────────────────
  colors: {
    skyTop:       '#0a0a1e',
    skyMid:       '#0d1b3e',
    skyBot:       '#122444',
    accent:       '#00ff44',      // pipe glow, panel border, LEDs
    accentDim:    '#00ff4430',
    score:        '#00ff88',
    title:        '#ff8050',
    titleGlow:    '#ff6030',
    ground:       '#0d0d0d',
    groundLine:   '#1a2a1a',
    groundText:   'rgba(0,255,80,0.35)',
    panelBg:      '#0a1a0a',
    deathRed:     '#ff4040',
    bestGold:     '#ffcc44',
    bgRack:       'rgba(30,50,90,0.6)',
  },

  // ── Player sprite ────────────────────────────────────────────────
  // Called each frame. ctx is pre-translated to bird center, pre-rotated.
  // flapFrame: ever-incrementing counter for animation
  // dead: true after collision
  drawPlayer(ctx, flapFrame, dead) {
    const t = flapFrame;
    const clawAngle = Math.sin(t * 0.4) * 0.3;
    const eyeWobble = Math.sin(t * 0.15) * 1;

    if (!dead) {
      ctx.shadowColor = '#ff6030';
      ctx.shadowBlur = 8;
    }

    // Tail fan
    ctx.fillStyle = '#cc3010';
    for (let i = -2; i <= 2; i++) {
      ctx.save();
      ctx.rotate(i * 0.18);
      ctx.fillRect(-18, -4, 10, 5);
      ctx.restore();
    }

    // Body segments
    for (const [sx, sy, sw, sh] of [[0,0,14,12],[6,0,10,10],[10,1,8,8]]) {
      ctx.fillStyle = '#e04020';
      ctx.beginPath();
      ctx.ellipse(-sx, sy, sw/2, sh/2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#aa2010';
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }

    // Shell highlight
    ctx.fillStyle = 'rgba(255,150,100,0.25)';
    ctx.beginPath();
    ctx.ellipse(-2, -3, 8, 5, -0.2, 0, Math.PI * 2);
    ctx.fill();

    // Big left claw
    ctx.save();
    ctx.rotate(-clawAngle);
    ctx.fillStyle = '#cc3010';
    ctx.beginPath();
    ctx.ellipse(10, -8, 9, 6, -0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#e04020';
    ctx.beginPath();
    ctx.moveTo(16, -10); ctx.lineTo(22, -14); ctx.lineTo(20, -8); ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#aa2010';
    ctx.beginPath();
    ctx.moveTo(16, -6); ctx.lineTo(21, -4); ctx.lineTo(19, -8); ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Small right claw
    ctx.save();
    ctx.rotate(clawAngle);
    ctx.fillStyle = '#cc3010';
    ctx.beginPath();
    ctx.ellipse(8, 8, 6, 4, 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Left eye stalk
    ctx.fillStyle = '#cc3010';
    ctx.fillRect(12, -13 + eyeWobble, 3, 6);
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(13.5, -14 + eyeWobble, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(14.5, -14.5 + eyeWobble, 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(15, -15.5 + eyeWobble, 0.8, 0, Math.PI * 2); ctx.fill();

    // Right eye stalk
    ctx.fillStyle = '#cc3010';
    ctx.fillRect(7, -12 + eyeWobble, 3, 5);
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(8.5, -13 + eyeWobble, 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(9, -13.5 + eyeWobble, 1.5, 0, Math.PI * 2); ctx.fill();

    // Antennae
    ctx.strokeStyle = '#ff7050';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(14, -17 + eyeWobble);
    ctx.quadraticCurveTo(20, -28, 26, -22);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(9, -15 + eyeWobble);
    ctx.quadraticCurveTo(14, -26, 18, -20);
    ctx.stroke();

    ctx.shadowBlur = 0;
  },
};
// ═══════════════════════════════════════════════════════════════════
//  ENGINE  — do not edit below unless modifying game mechanics
// ═══════════════════════════════════════════════════════════════════

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

const BASE_W = 288, BASE_H = 512;
let scale = 1;

function resize() {
  const s = Math.min(window.innerWidth / BASE_W, window.innerHeight / BASE_H);
  scale = s;
  canvas.width  = BASE_W * s;
  canvas.height = BASE_H * s;
  ctx.setTransform(s, 0, 0, s, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// Physics constants
const GRAVITY    = 0.25;
const FLAP_V     = -4.6;
const PIPE_W     = 52;
const PIPE_GAP   = 108;
const PIPE_SPEED = 1.6;
const GROUND_H   = 80;
const GROUND_Y   = BASE_H - GROUND_H;
const BIRD_X     = 60;
const BIRD_R     = 13;
const PIPE_INTERVAL = 90;

// State
let state = 'idle';
let bird, pipes, score, frame, groundOffset = 0;
let deathFrame = 0, shakeX = 0, shakeY = 0;
let particles = [];
let highScore = parseInt(localStorage.getItem(AGENT_CONFIG.highScoreKey) || '0', 10);

// Stars (generated once)
const stars = Array.from({ length: 40 }, () => ({
  x:     Math.random() * BASE_W,
  y:     Math.random() * GROUND_Y * 0.7,
  r:     Math.random() * 1.5 + 0.3,
  blink: Math.random() * Math.PI * 2,
}));

// Score pop animation
let scorePop = 0; // decays from 1 → 0 for pop effect

function reset() {
  bird = { y: BASE_H / 2 - 20, vy: 0, angle: 0, flapFrame: 0, dead: false };
  pipes = [];
  score = 0;
  frame = 0;
  particles = [];
  shakeX = shakeY = 0;
}
reset();

// ── Draw: Background ─
const C = AGENT_CONFIG.colors;

function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  grad.addColorStop(0,   C.skyTop);
  grad.addColorStop(0.5, C.skyMid);
  grad.addColorStop(1,   C.skyBot);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, BASE_W, GROUND_Y);
}

function drawStars() {
  for (const s of stars) {
    const alpha = 0.5 + 0.5 * Math.sin(s.blink + frame * 0.03);
    ctx.fillStyle = `rgba(180,210,255,${alpha.toFixed(2)})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawBgRacks() {
  const racks = [[20,200,30,100],[60,220,25,80],[110,180,40,120],
                 [170,210,28,90],[210,195,35,115],[255,215,22,85]];
  for (const [x, y, w, h] of racks) {
    ctx.fillStyle = C.bgRack;
    ctx.fillRect(x, y, w, h);
    for (let r = 0; r < 4; r++) {
      const on = Math.sin(frame * 0.05 + x * 0.1 + r) > 0;
      ctx.fillStyle = on ? 'rgba(0,255,100,0.8)' : 'rgba(0,255,100,0.15)';
      ctx.beginPath();
      ctx.arc(x + 5 + (r % 2) * 8, y + 8 + Math.floor(r / 2) * 8, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// ── Draw: Ground ─────────────────────────────────────────────────
function drawGround(offset) {
  ctx.fillStyle = C.ground;
  ctx.fillRect(0, GROUND_Y, BASE_W, GROUND_H);
  ctx.fillStyle = C.groundLine;
  ctx.fillRect(0, GROUND_Y, BASE_W, 3);

  ctx.font = '9px monospace';
  ctx.fillStyle = C.groundText;
  const prompts = AGENT_CONFIG.groundPrompts;
  for (let i = 0; i < 6; i++) {
    const x = ((i * 58 - offset * 0.5) % (BASE_W + 60)) - 10;
    ctx.fillText(prompts[i % prompts.length], x, GROUND_Y + 18);
  }

  for (let y = GROUND_Y + 22; y < BASE_H; y += 4) {
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fillRect(0, y, BASE_W, 2);
  }
}

// ── Draw: Pipes ──────────────────────────────────────────────────
function drawPipe(x, topH, botY) {
  const CAP = 24, EX = 5;
  ctx.shadowColor = C.accent;
  ctx.shadowBlur = 6;

  // Top body
  ctx.fillStyle = '#1a3a1a';
  ctx.fillRect(x + 2, 0, PIPE_W - 4, topH - CAP);
  ctx.fillStyle = '#2a5a2a';
  ctx.fillRect(x + 2, 0, 8, topH - CAP);
  ctx.fillStyle = '#0a1a0a';
  ctx.fillRect(x + PIPE_W - 10, 0, 8, topH - CAP);

  for (let py = 10; py < topH - CAP; py += 20) {
    ctx.fillStyle = Math.sin(frame * 0.08 + py * 0.1) > 0.3
      ? 'rgba(0,255,80,0.9)' : 'rgba(0,100,40,0.4)';
    ctx.fillRect(x + PIPE_W - 7, py, 4, 6);
  }

  ctx.fillStyle = '#2d6b2d';
  ctx.fillRect(x - EX, topH - CAP, PIPE_W + EX * 2, CAP);
  ctx.fillStyle = '#1a3a1a';
  ctx.fillRect(x - EX, topH - CAP + CAP - 4, PIPE_W + EX * 2, 4);
  ctx.strokeStyle = C.accent;
  ctx.lineWidth = 1;
  ctx.strokeRect(x - EX, topH - CAP, PIPE_W + EX * 2, CAP);

  // Bottom body
  ctx.fillStyle = '#1a3a1a';
  ctx.fillRect(x + 2, botY + CAP, PIPE_W - 4, GROUND_Y - botY - CAP);
  ctx.fillStyle = '#2a5a2a';
  ctx.fillRect(x + 2, botY + CAP, 8, GROUND_Y - botY - CAP);
  ctx.fillStyle = '#0a1a0a';
  ctx.fillRect(x + PIPE_W - 10, botY + CAP, 8, GROUND_Y - botY - CAP);

  for (let py = botY + CAP + 10; py < GROUND_Y; py += 20) {
    ctx.fillStyle = Math.sin(frame * 0.08 + py * 0.1 + 3) > 0.3
      ? 'rgba(0,255,80,0.9)' : 'rgba(0,100,40,0.4)';
    ctx.fillRect(x + PIPE_W - 7, py, 4, 6);
  }

  ctx.fillStyle = '#2d6b2d';
  ctx.fillRect(x - EX, botY, PIPE_W + EX * 2, CAP);
  ctx.fillStyle = '#1a3a1a';
  ctx.fillRect(x - EX, botY, PIPE_W + EX * 2, 4);
  ctx.strokeStyle = C.accent;
  ctx.lineWidth = 1;
  ctx.strokeRect(x - EX, botY, PIPE_W + EX * 2, CAP);

  ctx.shadowBlur = 0;
}

// ── Draw: Score ──────────────────────────────────────────────────
function drawScore(s) {
  const pop = 1 + scorePop * 0.3;
  ctx.save();
  ctx.translate(BASE_W / 2, 55);
  ctx.scale(pop, pop);
  ctx.textAlign = 'center';
  ctx.font = 'bold 28px monospace';
  ctx.fillStyle = C.score;
  ctx.shadowColor = C.score;
  ctx.shadowBlur = 10 + scorePop * 8;
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 4;
  ctx.strokeText(s, 0, 0);
  ctx.fillText(s, 0, 0);
  ctx.shadowBlur = 0;
  ctx.restore();
}

// ── Draw: Screen Idle ─────
// Tutorial button hit area (in BASE coords)
const TUTORIAL_BTN = { x: BASE_W / 2 - 60, y: BASE_H / 2 + 88, w: 120, h: 24 };

function drawIdleScreen() {
  ctx.textAlign = 'center';

  // Title
  ctx.font = 'bold 30px monospace';
  ctx.shadowColor = C.titleGlow;
  ctx.shadowBlur = 20;
  ctx.fillStyle = C.title;
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 4;
  ctx.strokeText(AGENT_CONFIG.title, BASE_W / 2, 108);
  ctx.fillText(AGENT_CONFIG.title, BASE_W / 2, 108);
  ctx.shadowBlur = 0;

  // Subtitle
  ctx.font = '9px monospace';
  ctx.fillStyle = 'rgba(255,130,80,0.7)';
  ctx.fillText('a claw agent production', BASE_W / 2, 122);

  // Lore block
  ctx.font = '9px monospace';
  ctx.fillStyle = 'rgba(0,255,80,0.6)';
  ctx.textAlign = 'left';
  AGENT_CONFIG.loreLines.forEach((line, i) => {
    ctx.fillText(line, 14, BASE_H / 2 - 20 + i * 14);
  });
  ctx.textAlign = 'center';

  // Start prompt (pulsing)
  const pulse = Math.sin(frame * 0.1) * 0.4 + 0.6;
  ctx.globalAlpha = pulse;
  ctx.font = 'bold 14px monospace';
  ctx.fillStyle = C.score;
  ctx.shadowColor = C.score;
  ctx.shadowBlur = 8;
  ctx.fillText(AGENT_CONFIG.startPrompt, BASE_W / 2, BASE_H / 2 + 62);
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;

  if (highScore > 0) {
    ctx.font = '10px monospace';
    ctx.fillStyle = 'rgba(255,200,100,0.8)';
    ctx.fillText(`BEST: ${highScore} ${AGENT_CONFIG.scoreLabel}`, BASE_W / 2, BASE_H / 2 + 78);
  }

  // How to play button
  const b = TUTORIAL_BTN;
  const hoverPulse = 0.85 + Math.sin(frame * 0.07) * 0.15;
  ctx.globalAlpha = hoverPulse;
  ctx.strokeStyle = 'rgba(0,255,130,0.5)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.roundRect(b.x, b.y, b.w, b.h, 4);
  ctx.stroke();
  ctx.font = '10px monospace';
  ctx.fillStyle = 'rgba(0,255,130,0.7)';
  ctx.fillText('[ ? HOW TO PLAY ]', BASE_W / 2, b.y + 16);
  ctx.globalAlpha = 1;
}

function drawTutorialScreen() {
  // Overlay
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0, 0, BASE_W, BASE_H);

  const px = BASE_W / 2 - 100, py = 80, pw = 200, ph = 320;

  // Panel
  ctx.fillStyle = '#08130d';
  ctx.strokeStyle = C.accent;
  ctx.lineWidth = 2;
  ctx.shadowColor = C.accent;
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.roundRect(px, py, pw, ph, 8);
  ctx.fill();
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Header
  ctx.textAlign = 'center';
  ctx.font = 'bold 13px monospace';
  ctx.fillStyle = C.title;
  ctx.fillText('// HOW TO PLAY', BASE_W / 2, py + 22);

  ctx.strokeStyle = C.accentDim;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(px + 12, py + 30);
  ctx.lineTo(px + pw - 12, py + 30);
  ctx.stroke();

  // Instructions
  const lines = [
    ['CONTROLS', null],
    ['TAP / SPACE', 'flap'],
    ['↑ ARROW', 'flap'],
    ['', null],
    ['OBJECTIVE', null],
    ['Dodge the server', null],
    ['conduits. Each', null],
    ['gap = +1 ' + AGENT_CONFIG.scoreLabel, null],
    ['', null],
    ['RANKS', null],
    ...AGENT_CONFIG.ranks.slice(0,4).map(([min, label, col]) =>
      [`[${label}] ≥ ${min}`, col]
    ),
    ['', null],
    ['High score saved', null],
    ['automatically.', null],
  ];

  ctx.font = '9px monospace';
  let ly = py + 46;
  for (const [text, col] of lines) {
    if (!text) { ly += 5; continue; }
    if (!col && text === text.toUpperCase() && text.length > 2) {
      // Section header
      ctx.fillStyle = 'rgba(0,255,130,0.8)';
      ctx.font = 'bold 9px monospace';
    } else if (col) {
      ctx.fillStyle = col;
      ctx.font = '9px monospace';
    } else {
      ctx.fillStyle = 'rgba(180,220,180,0.8)';
      ctx.font = '9px monospace';
    }
    ctx.fillText(text, BASE_W / 2, ly);
    ly += 14;
  }

  // Dismiss
  const pulse = Math.sin(frame * 0.1) * 0.4 + 0.6;
  ctx.globalAlpha = pulse;
  ctx.font = 'bold 11px monospace';
  ctx.fillStyle = C.score;
  ctx.shadowColor = C.score;
  ctx.shadowBlur = 6;
  ctx.fillText('[ TAP TO CLOSE ]', BASE_W / 2, py + ph - 14);
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

// ── Draw: Death Screen ───────────────────────────────────────────
function drawDeadScreen() {
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, 0, BASE_W, BASE_H);

  const px = BASE_W / 2 - 90, py = BASE_H / 2 - 75;

  ctx.fillStyle = C.panelBg;
  ctx.strokeStyle = C.accent;
  ctx.lineWidth = 2;
  ctx.shadowColor = C.accent;
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.roundRect(px, py, 180, 140, 6);
  ctx.fill();
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.textAlign = 'center';
  ctx.font = 'bold 14px monospace';
  ctx.fillStyle = C.deathRed;
  ctx.fillText(AGENT_CONFIG.deathTitle, BASE_W / 2, py + 24);

  ctx.font = '10px monospace';
  ctx.fillStyle = 'rgba(255,64,64,0.6)';
  ctx.fillText(AGENT_CONFIG.deathSubtitle, BASE_W / 2, py + 40);

  ctx.strokeStyle = C.accentDim;
  ctx.beginPath();
  ctx.moveTo(px + 10, py + 50);
  ctx.lineTo(px + 170, py + 50);
  ctx.stroke();

  ctx.font = '10px monospace';
  ctx.fillStyle = '#888';
  ctx.fillText(AGENT_CONFIG.scoreLabel.toUpperCase(), BASE_W / 2 - 38, py + 68);
  ctx.fillText('BEST', BASE_W / 2 + 44, py + 68);

  ctx.font = 'bold 22px monospace';
  ctx.fillStyle = C.score;
  ctx.fillText(score, BASE_W / 2 - 38, py + 94);
  ctx.fillStyle = C.bestGold;
  ctx.fillText(highScore, BASE_W / 2 + 44, py + 94);

  if (score > 0) {
    const [, rank, col] = AGENT_CONFIG.ranks.find(([min]) => score >= min);
    ctx.font = 'bold 18px monospace';
    ctx.fillStyle = col;
    ctx.shadowColor = col;
    ctx.shadowBlur = 8;
    ctx.fillText('[' + rank + ']', BASE_W / 2, py + 118);
    ctx.shadowBlur = 0;
  }

  const pulse = Math.sin(frame * 0.1) * 0.4 + 0.6;
  ctx.globalAlpha = pulse;
  ctx.font = 'bold 11px monospace';
  ctx.fillStyle = C.score;
  ctx.shadowColor = C.score;
  ctx.shadowBlur = 6;
  ctx.fillText(AGENT_CONFIG.restartPrompt, BASE_W / 2, py + 160);
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

// ── Particles ────────────────────────────────────────────────────
function spawnParticles(x, y) {
  const cols = AGENT_CONFIG.particleColors;
  for (let i = 0; i < 14; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 5,
      vy: (Math.random() - 0.5) * 5,
      life: 1,
      col: cols[Math.floor(Math.random() * cols.length)],
    });
  }
}

function updateParticles() {
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life -= 0.035;
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.col;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// ── Mechanics ───────────────────────
function spawnPipe() {
  const minTop = 70, maxTop = GROUND_Y - PIPE_GAP - 70;
  pipes.push({ x: BASE_W + PIPE_W, topH: minTop + Math.random() * (maxTop - minTop), scored: false });
}

function checkCollision() {
  const bx = BIRD_X, by = bird.y, r = BIRD_R - 3;
  if (by + r >= GROUND_Y || by - r <= 0) return true;
  for (const p of pipes) {
    const botY = p.topH + PIPE_GAP;
    if (bx + r > p.x - 6 && bx - r < p.x + PIPE_W + 6) {
      if (by - r < p.topH || by + r > botY) return true;
    }
  }
  return false;
}

function flap() {
  if (state === 'tutorial') { state = 'idle'; return; }
  if (state === 'idle') { state = 'playing'; bird.vy = FLAP_V; return; }
  if (state === 'dead') { reset(); state = 'playing'; bird.vy = FLAP_V; return; }
  if (state === 'playing') { bird.vy = FLAP_V; bird.flapFrame = 0; }
}

function handlePointer(e) {
  e.preventDefault();
  if (state === 'idle') {
    // Check if tapped the HOW TO PLAY button
    const rect = canvas.getBoundingClientRect();
    const cx = (e.clientX - rect.left) / scale;
    const cy = (e.clientY - rect.top) / scale;
    const b = TUTORIAL_BTN;
    if (cx >= b.x && cx <= b.x + b.w && cy >= b.y && cy <= b.y + b.h) {
      state = 'tutorial';
      return;
    }
  }
  flap();
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); flap(); }
  if (e.code === 'KeyH' && state === 'idle') { state = 'tutorial'; }
});
canvas.addEventListener('pointerdown', handlePointer);

// ── Loop Main ─
function loop() {
  frame++;
  groundOffset = (groundOffset + (state === 'playing' ? PIPE_SPEED : 0)) % 24;

  if (state === 'playing') {
    if (frame % PIPE_INTERVAL === 0) spawnPipe();

    bird.vy += GRAVITY;
    bird.y  += bird.vy;
    bird.flapFrame++;
    bird.angle = Math.min(Math.PI / 3, Math.max(-Math.PI / 6, bird.vy * 0.08));

    for (const p of pipes) {
      p.x -= PIPE_SPEED;
      if (!p.scored && p.x + PIPE_W < BIRD_X) {
        p.scored = true;
        score++;
        scorePop = 1;
        if (score > highScore) {
          highScore = score;
          localStorage.setItem(AGENT_CONFIG.highScoreKey, highScore);
        }
      }
    }
    pipes = pipes.filter(p => p.x > -PIPE_W - 30);

    if (checkCollision()) {
      state = 'dead';
      deathFrame = frame;
      spawnParticles(BIRD_X, bird.y);
    }
  }

  scorePop = Math.max(0, scorePop - 0.08);

  // Smooth shake decay
  const age = frame - deathFrame;
  const shakeAmt = state === 'dead' ? Math.max(0, 8 - age * 0.6) : 0;
  shakeX = (Math.random() - 0.5) * shakeAmt;
  shakeY = (Math.random() - 0.5) * shakeAmt;

  // ── Render ──────────────────────────────────────────────────
  drawSky();
  drawStars();
  drawBgRacks();

  for (const p of pipes) drawPipe(p.x, p.topH, p.topH + PIPE_GAP);
  drawGround(groundOffset);

  // Draw player (with shake on death)
  ctx.save();
  ctx.translate(BIRD_X + shakeX, bird.y + shakeY);
  ctx.rotate(state === 'dead' ? Math.PI / 2 : bird.angle);
  AGENT_CONFIG.drawPlayer(ctx, bird.flapFrame, state === 'dead');
  ctx.restore();

  updateParticles();

  if (state === 'playing') drawScore(score);
  if (state === 'idle')    { drawScore(0); drawIdleScreen(); }
  if (state === 'tutorial'){ drawScore(0); drawIdleScreen(); drawTutorialScreen(); }
  if (state === 'dead')    { drawScore(score); drawDeadScreen(); }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
