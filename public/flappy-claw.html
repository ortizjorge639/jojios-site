<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy Claw</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const BASE_W = 288;
const BASE_H = 512;
let scale = 1;

function resize() {
  const s = Math.min(window.innerWidth / BASE_W, window.innerHeight / BASE_H);
  scale = s;
  canvas.width = BASE_W * s;
  canvas.height = BASE_H * s;
  ctx.setTransform(s, 0, 0, s, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// === CONSTANTS ===
const GRAVITY    = 0.25;
const FLAP_V     = -4.6;
const PIPE_W     = 52;
const PIPE_GAP   = 108;
const PIPE_SPEED = 1.6;
const GROUND_H   = 80;
const GROUND_Y   = BASE_H - GROUND_H;
const BIRD_X     = 60;
const BIRD_R     = 13;

// === STATE ===
let state = 'idle';
let bird, pipes, score, frame, highScore = 0, groundOffset = 0;
let stars = [];
let particles = [];

// Generate stars once
for (let i = 0; i < 40; i++) {
  stars.push({
    x: Math.random() * BASE_W,
    y: Math.random() * GROUND_Y * 0.7,
    r: Math.random() * 1.5 + 0.3,
    blink: Math.random() * Math.PI * 2
  });
}

// Azure VM coordinates (narrative detail)
const LORE_LINES = [
  'CONTAINER: main',
  'NODE: azure-vm-01',
  'MODE: BUILD',
  'LEVEL: 96',
];

function reset() {
  bird = { y: BASE_H / 2 - 20, vy: 0, angle: 0, flapFrame: 0, dead: false };
  pipes = [];
  score = 0;
  frame = 0;
  particles = [];
}
reset();

// === DRAW: SKY / BG ===
function drawSky() {
  // Deep terminal night
  const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  grad.addColorStop(0,   '#0a0a1e');
  grad.addColorStop(0.5, '#0d1b3e');
  grad.addColorStop(1,   '#122444');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, BASE_W, GROUND_Y);
}

function drawStars() {
  for (const s of stars) {
    const alpha = 0.5 + 0.5 * Math.sin(s.blink + frame * 0.03);
    ctx.fillStyle = `rgba(180,210,255,${alpha})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Scrolling server-rack/pipe silhouettes in bg
let bgPipeX = BASE_W;
function drawBgPipes() {
  // Distant server racks - static art
  ctx.fillStyle = 'rgba(30,50,90,0.6)';
  const racks = [[20, 200, 30, 100], [60, 220, 25, 80], [110, 180, 40, 120],
                 [170, 210, 28, 90],  [210, 195, 35, 115], [255, 215, 22, 85]];
  for (const [x, y, w, h] of racks) {
    ctx.fillRect(x, y, w, h);
    // LED dots
    for (let r = 0; r < 4; r++) {
      const ledOn = Math.sin(frame * 0.05 + x * 0.1 + r) > 0;
      ctx.fillStyle = ledOn ? 'rgba(0,255,100,0.8)' : 'rgba(0,255,100,0.15)';
      ctx.beginPath();
      ctx.arc(x + 5 + (r % 2) * 8, y + 8 + Math.floor(r / 2) * 8, 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(30,50,90,0.6)';
  }
}

// === DRAW: GROUND (TERMINAL) ===
function drawGround(offset) {
  // Terminal floor
  ctx.fillStyle = '#0d0d0d';
  ctx.fillRect(0, GROUND_Y, BASE_W, GROUND_H);
  ctx.fillStyle = '#1a2a1a';
  ctx.fillRect(0, GROUND_Y, BASE_W, 3);

  // Scrolling terminal prompts
  ctx.font = '9px monospace';
  ctx.fillStyle = 'rgba(0,255,80,0.35)';
  const prompts = ['$ heartbeat --ok', '$ level 96', '$ node main.js', '$ git push', '$ deploy --vercel'];
  for (let i = 0; i < 6; i++) {
    const x = ((i * 58 - offset * 0.5) % (BASE_W + 60)) - 10;
    ctx.fillText(prompts[i % prompts.length], x, GROUND_Y + 18);
  }

  // Scanline effect on ground
  for (let y = GROUND_Y + 22; y < BASE_H; y += 4) {
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fillRect(0, y, BASE_W, 2);
  }
}

// === DRAW: PIPES (SERVER RACKS / DATA CONDUITS) ===
function drawPipe(x, topH, botY) {
  const CAP = 24, EX = 5;

  // Pipe glow
  ctx.shadowColor = '#00ff44';
  ctx.shadowBlur = 6;

  // Top pipe body
  ctx.fillStyle = '#1a3a1a';
  ctx.fillRect(x + 2, 0, PIPE_W - 4, topH - CAP);
  ctx.fillStyle = '#2a5a2a';
  ctx.fillRect(x + 2, 0, 8, topH - CAP);
  ctx.fillStyle = '#0a1a0a';
  ctx.fillRect(x + PIPE_W - 10, 0, 8, topH - CAP);

  // LED strip on pipe
  for (let py = 10; py < topH - CAP; py += 20) {
    const on = Math.sin(frame * 0.08 + py * 0.1) > 0.3;
    ctx.fillStyle = on ? 'rgba(0,255,80,0.9)' : 'rgba(0,100,40,0.4)';
    ctx.fillRect(x + PIPE_W - 7, py, 4, 6);
  }

  // Top cap
  ctx.fillStyle = '#2d6b2d';
  ctx.fillRect(x - EX, topH - CAP, PIPE_W + EX * 2, CAP);
  ctx.fillStyle = '#1a3a1a';
  ctx.fillRect(x - EX, topH - CAP + CAP - 4, PIPE_W + EX * 2, 4);
  ctx.strokeStyle = '#00ff44';
  ctx.lineWidth = 1;
  ctx.strokeRect(x - EX, topH - CAP, PIPE_W + EX * 2, CAP);

  // Bottom pipe body
  ctx.fillStyle = '#1a3a1a';
  ctx.fillRect(x + 2, botY + CAP, PIPE_W - 4, GROUND_Y - botY - CAP);
  ctx.fillStyle = '#2a5a2a';
  ctx.fillRect(x + 2, botY + CAP, 8, GROUND_Y - botY - CAP);
  ctx.fillStyle = '#0a1a0a';
  ctx.fillRect(x + PIPE_W - 10, botY + CAP, 8, GROUND_Y - botY - CAP);

  for (let py = botY + CAP + 10; py < GROUND_Y; py += 20) {
    const on = Math.sin(frame * 0.08 + py * 0.1 + 3) > 0.3;
    ctx.fillStyle = on ? 'rgba(0,255,80,0.9)' : 'rgba(0,100,40,0.4)';
    ctx.fillRect(x + PIPE_W - 7, py, 4, 6);
  }

  // Bottom cap
  ctx.fillStyle = '#2d6b2d';
  ctx.fillRect(x - EX, botY, PIPE_W + EX * 2, CAP);
  ctx.fillStyle = '#1a3a1a';
  ctx.fillRect(x - EX, botY, PIPE_W + EX * 2, 4);
  ctx.strokeStyle = '#00ff44';
  ctx.lineWidth = 1;
  ctx.strokeRect(x - EX, botY, PIPE_W + EX * 2, CAP);

  ctx.shadowBlur = 0;
}

// === DRAW: CLAW (THE LOBSTER) ===
function drawClaw(x, y, angle, flapFrame, dead) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);

  const t = flapFrame;
  const clawAngle = Math.sin(t * 0.4) * 0.3; // claw snap

  // Glow
  if (!dead) {
    ctx.shadowColor = '#ff6030';
    ctx.shadowBlur = 8;
  }

  // Tail fan
  ctx.fillStyle = '#cc3010';
  for (let i = -2; i <= 2; i++) {
    ctx.save();
    ctx.rotate(i * 0.18);
    ctx.fillRect(-18, -4, 10, 5);
    ctx.restore();
  }

  // Body segments
  const segs = [[0,0,14,12],[6,0,10,10],[10,1,8,8]];
  for (const [sx, sy, sw, sh] of segs) {
    ctx.fillStyle = '#e04020';
    ctx.beginPath();
    ctx.ellipse(-sx, sy, sw/2, sh/2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#aa2010';
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }

  // Shell highlight
  ctx.fillStyle = 'rgba(255,150,100,0.25)';
  ctx.beginPath();
  ctx.ellipse(-2, -3, 8, 5, -0.2, 0, Math.PI * 2);
  ctx.fill();

  // Left big claw
  ctx.save();
  ctx.rotate(-clawAngle);
  ctx.fillStyle = '#cc3010';
  ctx.beginPath();
  ctx.ellipse(10, -8, 9, 6, -0.6, 0, Math.PI * 2);
  ctx.fill();
  // Claw pincer top
  ctx.fillStyle = '#e04020';
  ctx.beginPath();
  ctx.moveTo(16, -10);
  ctx.lineTo(22, -14);
  ctx.lineTo(20, -8);
  ctx.closePath();
  ctx.fill();
  // Claw pincer bot
  ctx.fillStyle = '#aa2010';
  ctx.beginPath();
  ctx.moveTo(16, -6);
  ctx.lineTo(21, -4);
  ctx.lineTo(19, -8);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Right claw (smaller)
  ctx.save();
  ctx.rotate(clawAngle);
  ctx.fillStyle = '#cc3010';
  ctx.beginPath();
  ctx.ellipse(8, 8, 6, 4, 0.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Eyes on stalks
  const eyeWobble = Math.sin(t * 0.15) * 1;
  // Left eye
  ctx.fillStyle = '#cc3010';
  ctx.fillRect(12, -13 + eyeWobble, 3, 6);
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(13.5, -14 + eyeWobble, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(14.5, -14.5 + eyeWobble, 2, 0, Math.PI * 2);
  ctx.fill();
  // Eye shine
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(15, -15.5 + eyeWobble, 0.8, 0, Math.PI * 2);
  ctx.fill();

  // Right eye
  ctx.fillStyle = '#cc3010';
  ctx.fillRect(7, -12 + eyeWobble, 3, 5);
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(8.5, -13 + eyeWobble, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(9, -13.5 + eyeWobble, 1.5, 0, Math.PI * 2);
  ctx.fill();

  // Antennae
  ctx.strokeStyle = '#ff7050';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(14, -17 + eyeWobble);
  ctx.quadraticCurveTo(20, -28, 26, -22);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(9, -15 + eyeWobble);
  ctx.quadraticCurveTo(14, -26, 18, -20);
  ctx.stroke();

  ctx.shadowBlur = 0;
  ctx.restore();
}

// === DRAW: SCORE ===
function drawScore(s) {
  ctx.textAlign = 'center';
  ctx.font = 'bold 28px monospace';
  ctx.fillStyle = '#00ff88';
  ctx.shadowColor = '#00ff88';
  ctx.shadowBlur = 10;
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 4;
  ctx.strokeText(s, BASE_W / 2, 55);
  ctx.fillText(s, BASE_W / 2, 55);
  ctx.shadowBlur = 0;
}

// === DRAW: IDLE SCREEN ===
function drawIdleScreen() {
  // Title glow
  ctx.textAlign = 'center';
  ctx.font = 'bold 30px monospace';
  ctx.shadowColor = '#ff6030';
  ctx.shadowBlur = 20;
  ctx.fillStyle = '#ff8050';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 4;
  ctx.strokeText('FLAPPY CLAW', BASE_W / 2, 130);
  ctx.fillText('FLAPPY CLAW', BASE_W / 2, 130);
  ctx.shadowBlur = 0;

  // Lore lines
  ctx.font = '9px monospace';
  ctx.fillStyle = 'rgba(0,255,80,0.6)';
  ctx.textAlign = 'left';
  for (let i = 0; i < LORE_LINES.length; i++) {
    ctx.fillText(LORE_LINES[i], 14, BASE_H/2 - 30 + i * 14);
  }
  ctx.textAlign = 'center';

  // Tap prompt
  const pulse = Math.sin(frame * 0.1) * 0.4 + 0.6;
  ctx.globalAlpha = pulse;
  ctx.font = 'bold 13px monospace';
  ctx.fillStyle = '#00ff88';
  ctx.shadowColor = '#00ff88';
  ctx.shadowBlur = 8;
  ctx.fillText('[ TAP TO DEPLOY ]', BASE_W / 2, BASE_H / 2 + 65);
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;

  if (highScore > 0) {
    ctx.font = '11px monospace';
    ctx.fillStyle = 'rgba(255,200,100,0.8)';
    ctx.fillText('BEST: ' + highScore + ' heartbeats', BASE_W / 2, BASE_H / 2 + 84);
  }
}

// === DRAW: DEAD SCREEN ===
function drawDeadScreen() {
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, 0, BASE_W, BASE_H);

  const px = BASE_W/2 - 90, py = BASE_H/2 - 75;

  // Panel
  ctx.fillStyle = '#0a1a0a';
  ctx.strokeStyle = '#00ff44';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#00ff44';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.roundRect(px, py, 180, 140, 6);
  ctx.fill();
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Error header
  ctx.textAlign = 'center';
  ctx.font = 'bold 14px monospace';
  ctx.fillStyle = '#ff4040';
  ctx.fillText('PROCESS KILLED', BASE_W/2, py + 24);
  ctx.font = '10px monospace';
  ctx.fillStyle = 'rgba(255,64,64,0.6)';
  ctx.fillText('exit code: 1  |  signal: SIGPIPE', BASE_W/2, py + 40);

  // Divider
  ctx.strokeStyle = '#00ff4430';
  ctx.beginPath();
  ctx.moveTo(px + 10, py + 50);
  ctx.lineTo(px + 170, py + 50);
  ctx.stroke();

  ctx.font = '10px monospace';
  ctx.fillStyle = '#888';
  ctx.fillText('HEARTBEATS', BASE_W/2 - 38, py + 68);
  ctx.fillText('BEST', BASE_W/2 + 44, py + 68);

  ctx.font = 'bold 22px monospace';
  ctx.fillStyle = '#00ff88';
  ctx.fillText(score, BASE_W/2 - 38, py + 94);
  ctx.fillStyle = '#ffcc44';
  ctx.fillText(highScore, BASE_W/2 + 44, py + 94);

  // Medal / rank
  if (score > 0) {
    const ranks = [[50,'S','#ff6030'],[30,'A','#ffd700'],[15,'B','#c0c0c0'],[5,'C','#cd7f32'],[0,'D','#888']];
    const [, rank, col] = ranks.find(([min]) => score >= min);
    ctx.font = 'bold 18px monospace';
    ctx.fillStyle = col;
    ctx.shadowColor = col;
    ctx.shadowBlur = 8;
    ctx.fillText('[' + rank + ']', BASE_W/2, py + 118);
    ctx.shadowBlur = 0;
  }

  // Restart
  const pulse = Math.sin(frame * 0.1) * 0.4 + 0.6;
  ctx.globalAlpha = pulse;
  ctx.font = 'bold 11px monospace';
  ctx.fillStyle = '#00ff88';
  ctx.shadowColor = '#00ff88';
  ctx.shadowBlur = 6;
  ctx.fillText('[ TAP TO RESPAWN ]', BASE_W/2, py + 160);
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

// === PARTICLES ===
function spawnParticles(x, y) {
  for (let i = 0; i < 12; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 4,
      vy: (Math.random() - 0.5) * 4,
      life: 1,
      col: ['#ff6030','#ff3010','#ff8050','#ffaa40'][Math.floor(Math.random()*4)]
    });
  }
}

function updateParticles() {
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life -= 0.04;
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.col;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// === PIPE SPAWN ===
function spawnPipe() {
  const minTop = 70, maxTop = GROUND_Y - PIPE_GAP - 70;
  const topH = minTop + Math.random() * (maxTop - minTop);
  pipes.push({ x: BASE_W + PIPE_W, topH, scored: false });
}

// === COLLISION ===
function checkCollision() {
  const bx = BIRD_X, by = bird.y, r = BIRD_R - 3;
  if (by + r >= GROUND_Y || by - r <= 0) return true;
  for (const p of pipes) {
    const botY = p.topH + PIPE_GAP;
    if (bx + r > p.x - 6 && bx - r < p.x + PIPE_W + 6) {
      if (by - r < p.topH || by + r > botY) return true;
    }
  }
  return false;
}

// === INPUT ===
function flap() {
  if (state === 'idle') { state = 'playing'; bird.vy = FLAP_V; return; }
  if (state === 'dead') { reset(); state = 'playing'; bird.vy = FLAP_V; return; }
  if (state === 'playing') { bird.vy = FLAP_V; bird.flapFrame = 0; }
}

document.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp') flap(); });
canvas.addEventListener('pointerdown', e => { e.preventDefault(); flap(); });

// === LOOP ===
const PIPE_INTERVAL = 90;
let deathFrame = 0;

function loop() {
  frame++;
  groundOffset = (groundOffset + (state === 'playing' ? PIPE_SPEED : 0)) % 24;

  if (state === 'playing' && frame % PIPE_INTERVAL === 0) spawnPipe();

  if (state === 'playing') {
    bird.vy += GRAVITY;
    bird.y += bird.vy;
    bird.flapFrame++;
    bird.angle = Math.min(Math.PI / 3, Math.max(-Math.PI / 6, bird.vy * 0.08));

    for (const p of pipes) {
      p.x -= PIPE_SPEED;
      if (!p.scored && p.x + PIPE_W < BIRD_X) {
        p.scored = true;
        score++;
        if (score > highScore) highScore = score;
      }
    }
    pipes = pipes.filter(p => p.x > -PIPE_W - 30);

    if (checkCollision()) {
      state = 'dead';
      deathFrame = frame;
      spawnParticles(BIRD_X, bird.y);
    }
  }

  // --- DRAW ---
  drawSky();
  drawStars();
  drawBgPipes();

  for (const p of pipes) drawPipe(p.x, p.topH, p.topH + PIPE_GAP);

  drawGround(groundOffset);

  // Claw
  if (state === 'dead') {
    // Shake on death
    const shakeAmt = Math.max(0, 8 - (frame - deathFrame) * 0.5);
    const sx = (Math.random() - 0.5) * shakeAmt;
    const sy = (Math.random() - 0.5) * shakeAmt;
    ctx.save();
    ctx.translate(sx, sy);
    drawClaw(BIRD_X, bird.y, Math.PI / 2, bird.flapFrame, true);
    ctx.restore();
  } else {
    drawClaw(BIRD_X, bird.y, bird.angle, bird.flapFrame, false);
  }

  updateParticles();

  if (state === 'playing') drawScore(score);
  if (state === 'idle') { drawScore(0); drawIdleScreen(); }
  if (state === 'dead') { drawScore(score); drawDeadScreen(); }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
